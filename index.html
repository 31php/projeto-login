<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/estilo.css" media="all">
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    

    <link rel="stylesheet" href="estilos/mediaQuery.css">
    <title>Login</title>
</head>
<body>
    <main>
        <section id="login">
            <div class="foto">

            </div>
            <div class="formulario">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder realizar as configurações no seu ambiente </p>
            </div>
            <form action="#" method="post" autocomplete="on">
                <div class="campo">   
                    <span class="material-symbols-outlined">person</span>                
                    <input type="email" name="" id="campo-email" placeholder="seu e-mail" autocomplete="email">
                    <label for="login">Login</label>
                </div>
                <div class="campo">
                    <span class="material-symbols-outlined">key</span> 
                    <input type="password" name="" id="campo-senha" placeholder="sua senha" autocomplete="current-password">
                    <label for="senha">senha</label>
                </div>
                <input type="submit" value="Entrar">
            </form>
        </section>
    </main>
</body>
</html>
