<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">   
    <link rel="stylesheet" href="css/mediaQueries.css">
    <title>Login</title>
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">

            </div>
            <div id="formulario">
                <h1>login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer
                    as confugirações no seu ambiente
                </p>
                <form action="" method="post" autocomplete="on">
                    <div class="campo">
                        <label for="meuLogin">Login</label>
                        <input type="email" name="login" id="meuLogin" placeholder="seu e-mail" autocomplete="email" required maxlength="30">
                    </div>
                    <div class="campo">
                        <label for="minhaSenha">Senha</label>
                        <input type="password" name="senha" id="minhaSenha" placeholder="sua senha" autocomplete="current-password" required minlength="6">
                    </div>
                    <input type="submit" value="enviar">
                </form>
            </div>
        </section>
    </main>
</body>
</html>
