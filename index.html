<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">   
    <link rel="stylesheet" href="css/mediaQueries.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>Login</title>
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">

            </div>
            <div id="formulario">
                <h1>login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer
                    as confugirações no seu ambiente
                </p>
                <form action="" method="post" autocomplete="on">
                    <div class="campo">
                       <span class="material-symbols-outlined">person<span>                        
                        <input type="email" name="login" id="meuLogin" placeholder="seu e-mail" autocomplete="email" required maxlength="30">
                        <label for="meuLogin">Login</label>
                    </div>
                    <div class="campo">
                        <span class="material-symbols-outlined">vpn_key</span>                   
                        <input type="password" name="senha" id="minhaSenha" placeholder="sua senha" autocomplete="current-password" required minlength="6">
                        <label for="minhaSenha">Senha</label>
                    </div>
                    <input type="submit" value="enviar">
                    <a href="esqueci.html" class="botao">
                        esqueci a senha <i class="material-symbols-outlined">mail</i>
                    </a>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
