<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <link rel="stylesheet" href="css/estilo.css"> 
    <link rel="stylesheet" href="css/mediaQuery.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>Tela de login</title>
</head>
<body>
   <main>
    <section id="login">
        <div id="imagem">
            <!--Aqui vai a imagem em CSS-->
        </div>
        <div id="formulario">
            <h1>Login</h1>
            <p>
                Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer
                as configurações no seu ambiente.
            </p>
            <form action="Login.php" method="post" autocomplete="on">
                <div class="campo">
                    <i class="material-symbols-outlined">person</i>
                    <input type="email" name="" id="meuLogin" placeholder="seu email" autocomplete="email" required>
                    <label for="meuLogin">Login</label>
                </div>
                <div class="campo">
                    <i class="material-symbols-outlined">vpn_key</i>
                    <input type="password" name="" id="minhaSenha" placeholder="sua senha" autocomplete="current-password" required>
                    <label for="minhaSenha">Senha</label>
                </div>
                <input type="submit" value="Entrar">
                <a href="#">
                    Esqueci a senha <i class="material-symbols-outlined">mail</i>
                </a>
            </form>
        </div>
    </section>
   </main>
</body>
</html>
